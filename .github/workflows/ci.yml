name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy homeassistant voluptuous

      - name: Run Ruff (Linting)
        run: ruff check custom_components/tsun

      - name: Run MyPy (Type Checking)
        run: mypy custom_components/tsun --ignore-missing-imports --explicit-package-bases

      - name: Run Pytest
        run: pytest custom_components/tsun/tests -q --tb=short

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
